name: Autopartides ECIT

on:
  workflow_dispatch:
    inputs:
      games:
        description: 'Partides totals'
        default: '300'
        required: false
      temperature:
        description: 'Temperatura de la política (0 = determinista)'
        default: '0.35'
        required: false
      max_plies:
        description: 'Límit de plies per partida'
        default: '120'
        required: false
  schedule:
    # Cada nit a les 02:30 UTC (~36 s de còmput per 900 partides)
    - cron: '30 2 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Genera corpus
        run: |
          SEED=$(( $(date +%s) % 1000000007 ))
          mkdir -p corpus
          node scripts/generate.mjs \
            --games "${{ github.event.inputs.games || '300' }}" \
            --temperature "${{ github.event.inputs.temperature || '0.35' }}" \
            --max-plies "${{ github.event.inputs.max_plies || '120' }}" \
            --seed "$SEED" \
            --out "corpus/ecit-corpus-$(date +%F).txt" \
            --append

      - name: Puja el corpus com a artifact
        uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ github.run_number }}
          path: corpus/
          retention-days: 90

      # Per acumular el corpus al repo (10.000 partides en dies), descomenta
      # aquest bloc. Amb --append no s'escriuen duplicats:
