<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accedir</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box {
      background: #1a1a1a;
      padding: 2rem;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .tabs {
      display: flex;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #333;
    }
    .tab {
      flex: 1;
      padding: 0.75rem;
      text-align: center;
      cursor: pointer;
      border: none;
      background: none;
      color: #888;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .tab.active {
      color: #fff;
      border-bottom: 2px solid #fff;
    }
    .form { display: none; }
    .form.active { display: block; }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: #aaa;
    }
    input {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #333;
      border-radius: 4px;
      background: #0a0a0a;
      color: #fff;
      font-size: 1rem;
    }
    input:focus {
      outline: none;
      border-color: #555;
    }
    button[type="submit"] {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 4px;
      background: #fff;
      color: #000;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button[type="submit"]:hover {
      background: #e0e0e0;
    }
    .error {
      color: #ff4444;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      display: none;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Accedir al joc</h1>
    <div class="tabs">
      <button class="tab active" data-form="login">Iniciar sessió</button>
      <button class="tab" data-form="signup">Registrar-se</button>
    </div>
    
    <form id="login-form" class="form active">
      <div class="error" id="login-error"></div>
      <label for="login-email">Correu electrònic</label>
      <input type="email" id="login-email" required>
      <label for="login-password">Contrasenya</label>
      <input type="password" id="login-password" required>
      <button type="submit">Entrar</button>
    </form>
    
    <form id="signup-form" class="form">
      <div class="error" id="signup-error"></div>
      <label for="signup-email">Correu electrònic</label>
      <input type="email" id="signup-email" required>
      <label for="signup-password">Contrasenya</label>
      <input type="password" id="signup-password" required minlength="6">
      <label for="signup-password2">Confirmar contrasenya</label>
      <input type="password" id="signup-password2" required>
      <button type="submit">Registrar-se</button>
    </form>
  </div>

  <script>
    // Canviar entre formularis
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.form + '-form').classList.add('active');
      });
    });

    // Funcions d'ajuda per localStorage
    function getUsers() {
      return JSON.parse(localStorage.getItem('users') || '{}');
    }
    function saveUsers(users) {
      localStorage.setItem('users', JSON.stringify(users));
    }
    function setCurrentUser(email) {
      localStorage.setItem('currentUser', email);
    }
    function getCurrentUser() {
      return localStorage.getItem('currentUser');
    }

    // Login
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const errorEl = document.getElementById('login-error');
      
      const users = getUsers();
      if (!users[email]) {
        errorEl.textContent = 'Usuari no registrat';
        errorEl.classList.add('show');
        return;
      }
      if (users[email].password !== password) {
        errorEl.textContent = 'Contrasenya incorrecta';
        errorEl.classList.add('show');
        return;
      }
      
      setCurrentUser(email);
      window.location.href = 'index.html';
    });

    // Signup
    document.getElementById('signup-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const password2 = document.getElementById('signup-password2').value;
      const errorEl = document.getElementById('signup-error');
      
      if (password !== password2) {
        errorEl.textContent = 'Les contrasenyes no coincideixen';
        errorEl.classList.add('show');
        return;
      }
      
      const users = getUsers();
      if (users[email]) {
        errorEl.textContent = 'Aquest correu ja està registrat';
        errorEl.classList.add('show');
        return;
      }
      
      users[email] = { password, created: new Date().toISOString() };
      saveUsers(users);
      setCurrentUser(email);
      window.location.href = 'index.html';
    });

    // Si ja hi ha sessió, redirigir al joc
    if (getCurrentUser()) {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
